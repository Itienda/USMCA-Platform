<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estado del servicio · PRODENSA USMCA Intelligence</title>
<meta name="robots" content="noindex">
<style>
:root{--navy:#0A2540;--cyan:#00AEEF;--bg:#F4F6F8;--card:#fff;--line:#E1E7ED;--gray:#5A6B7C;--ok:#3E9B6E;--warn:#E8A93B;--bad:#D64545}
@media(prefers-color-scheme:dark){:root{--bg:#0E151D;--card:#152029;--line:#24303C;--gray:#9FB0C0}body{color:#E8EEF4}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',system-ui,Arial,sans-serif;background:var(--bg);padding:32px 18px;color:#1A1A1A}
.wrap{max-width:720px;margin:0 auto}
h1{color:var(--navy);font-size:21px;margin-bottom:4px}
.sub{color:var(--gray);font-size:13px;margin-bottom:24px}
.big{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gray);border-radius:12px;padding:22px 24px;margin-bottom:18px}
.big h2{font-size:17px;margin-bottom:6px}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}
.m{color:var(--gray);font-size:12px}
footer{color:var(--gray);font-size:11.5px;margin-top:26px;text-align:center}
a{color:var(--cyan)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Estado del servicio</h1>
  <div class="sub">PRODENSA · USMCA Intelligence — página pública, sin datos de clientes</div>
  <div class="big" id="global"><h2>Consultando…</h2><div class="m">Un momento.</div></div>
  <div id="det"></div>
  <footer>Actualizado al cargar esta página · <a href="./">Ir a la plataforma</a> · Incidencias: itiendac@prodensa.com</footer>
</div>
<script>
/* Página de estado: consulta la vista pública `service_status` de Supabase
   (solo agregados: fechas y conteos; ningún contenido de cliente). Si no
   responde, lo dice — no finge estar en verde. */
const SUPABASE_URL = "https://ydcslciexvvkvklqwohl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkY3NsY2lleHZ2a3ZrbHF3b2hsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzNDQ4NTMsImV4cCI6MjEwMDkyMDg1M30.xMOKQrfPu0hK4UtqUeKbQKiLIZ1Ct3aFELO80maKK1U";  /* se rellena en el deploy con la anon key */
const $ = (id) => document.getElementById(id);
const dias = (d) => d ? Math.round((Date.now() - new Date(d + "T12:00:00")) / 864e5) : null;

function pinta(nivel, titulo, detalle, filas) {
  const col = { ok: "var(--ok)", warn: "var(--warn)", bad: "var(--bad)" }[nivel];
  const ico = { ok: "✔", warn: "▲", bad: "✖" }[nivel];
  $("global").style.borderLeftColor = col;
  $("global").innerHTML = `<h2 style="color:${col}">${ico} ${titulo}</h2><div class="m">${detalle}</div>`;
  $("det").innerHTML = (filas || []).map(f =>
    `<div class="row"><span><span class="dot ${f.n}"></span>${f.k}</span><span class="m">${f.v}</span></div>`).join("");
}
(async () => {
  if (!SUPABASE_ANON_KEY) { pinta("warn", "Estado no disponible", "Esta página se activa al configurar la llave pública en el deploy.", []); return; }
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/service_status?select=*`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const [s] = await r.json();
    if (!s) throw new Error("sin datos");
    const edad = dias(s.ultima_edicion), edadMk = dias(s.markets_updated);
    const filas = [
      { k: "Última edición publicada", v: s.ultima_edicion + (edad !== null ? ` (hace ${edad} d)` : ""), n: edad <= 1 ? "ok" : edad <= 3 ? "warn" : "bad" },
      { k: "Datos de mercado", v: (s.markets_updated || "—") + (edadMk !== null ? ` (hace ${edadMk} d)` : ""), n: edadMk <= 1 ? "ok" : edadMk <= 3 ? "warn" : "bad" },
      { k: "Fuentes oficiales (últimas 24 h)", v: (s.institucional_24h ?? 0) + " documento(s)", n: (s.institucional_24h ?? 0) > 0 ? "ok" : "warn" },
      { k: "Fuentes con falla en la última corrida", v: (s.fuentes_falla ?? 0), n: (s.fuentes_falla ?? 0) === 0 ? "ok" : "warn" },
      { k: "Alertas entregadas (7 d)", v: (s.alertas_7d ?? 0), n: "ok" }
    ];
    const peor = filas.some(f => f.n === "bad") ? "bad" : filas.some(f => f.n === "warn") ? "warn" : "ok";
    pinta(peor,
      peor === "ok" ? "Todos los sistemas operando" : peor === "warn" ? "Operando con avisos" : "Servicio degradado",
      peor === "ok" ? "El boletín y los datos están al día." : "Hay componentes con retraso; el equipo de PRODENSA ya está notificado.",
      filas);
  } catch (e) {
    pinta("bad", "No se pudo consultar el estado", "La base de datos no respondió. Si la plataforma tampoco carga, escribe a itiendac@prodensa.com.", []);
  }
})();
</script>
</body>
</html>
